[package]
name = "poro-desktop"
version = "0.1.0"
description = "Desktop shell for the Poro AI coding workspace"
authors = ["Poro"]
edition = "2021"

[workspace]
members = ["crates/agent-browser"]
resolver = "2"

[lib]
name = "poro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
harness-client = { path = "../../harness/crates/harness-client" }
harness-events = { path = "../../harness/crates/harness-events" }
harness-policy = { path = "../../harness/crates/harness-policy" }
harness-providers = { path = "../../harness/crates/harness-providers" }
harness-storage = { path = "../../harness/crates/harness-storage" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["serde", "v4"] }
